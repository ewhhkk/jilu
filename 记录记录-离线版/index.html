<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFCF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记录记录">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>记录记录</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one phone-width column; sticky header, scrolling content, bottom tab bar fixed with safe-area padding. */
:root{
  --bg:#FFFCF8; --surf:#F6F1EB; --card:#FFFFFF; --fg:#2B2622; --muted:#8A8078; --faint:#A79E96; --line:#EEE6DE;
  --red:#D64545; --green:#3E9B6A; --gold:#C98A1B;
  --a:#E8772E;
  --a2:color-mix(in srgb,var(--a) 14%,var(--card));
  --a3:color-mix(in srgb,var(--a) 72%,var(--fg));
  --red2:color-mix(in srgb,var(--red) 12%,var(--card));
  --green2:color-mix(in srgb,var(--green) 14%,var(--card));
  --f:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,'SF Pro Rounded','PingFang SC',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1714; --surf:#221E1A; --card:#2B2622; --fg:#F2ECE6; --muted:#A79E96; --faint:#7E756D; --line:#3A332D;
  --red:#F07070; --green:#5CC08A; --gold:#E3AE4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1714; --surf:#221E1A; --card:#2B2622; --fg:#F2ECE6; --muted:#A79E96; --faint:#7E756D; --line:#3A332D;
  --red:#F07070; --green:#5CC08A; --gold:#E3AE4A; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-size:22px;width:1em;height:1em;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none;line-height:1}
.ms svg{width:100%;height:100%;display:block}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px;gap:8px}
.top h1{margin:0;font-size:24px;font-weight:500;line-height:1.2}
.top .sub{font-size:12px;color:var(--muted);letter-spacing:.04em}
.iconbtn{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--surf)}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 4px 10px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);cursor:pointer;min-width:56px;padding:2px 0}
.tab .ms{font-size:24px}
.tab.on{color:var(--a)}
.sec{margin-top:18px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.sech h2{font-size:16px;font-weight:500;margin:0}
.sech h2 small{font-size:11px;color:var(--faint);font-weight:400;margin-left:6px;letter-spacing:.04em}
.link{background:none;border:0;color:var(--a3);font-size:13px;cursor:pointer;padding:4px}
.panel{background:var(--surf);border-radius:16px;padding:12px}
.row{background:var(--card);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;min-width:0}
.row+.row{margin-top:8px}
.row .grow{flex:1;min-width:0}
.row .t{font-size:16px;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row.alert{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 40%,transparent)}
.row .amt{font-family:var(--num);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--a2);color:var(--a3);flex:none}
.ico.red{background:var(--red2);color:var(--red)}
.ico.green{background:var(--green2);color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surf);color:var(--muted);white-space:nowrap;border:0}
.chip.a{background:var(--a2);color:var(--a3)}
.chip.red{background:var(--red2);color:var(--red)}
.chip.green{background:var(--green2);color:var(--green)}
.chip.gold{background:color-mix(in srgb,var(--gold) 16%,var(--card));color:var(--gold)}
.seg{display:flex;background:var(--surf);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--fg)}
.pill.on{background:var(--a);border-color:var(--a);color:#fff}
.big{font-family:var(--num);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--a);border-radius:4px}
.bar.thin{height:5px;background:var(--line)}
.hero{background:var(--a2);border-radius:16px;padding:14px;color:var(--a3)}
.hero.over{background:var(--red2);color:var(--red)}
.tile.hero{background:var(--a2);color:var(--a3)}
.tile.hero.over{background:var(--red2);color:var(--red)}
.hero.over .bar i{background:var(--red)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .tile .v{overflow-wrap:anywhere}
.tile{background:var(--card);border-radius:12px;padding:12px;min-width:0;cursor:pointer;border:0;text-align:left;width:100%}
.tile .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tile .v{font-family:var(--num);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal .wd{font-size:11px;color:var(--faint);padding:2px 0 4px}
.cal .d{height:46px;border:0;background:none;border-radius:12px;font-size:15px;padding-top:5px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--fg)}
.cal .d.other{visibility:hidden}
.cal .d.today{background:var(--a);color:#fff}
.cal .d.sel:not(.today){box-shadow:inset 0 0 0 1.5px var(--a)}
.dots{display:flex;gap:3px;justify-content:center;margin-top:4px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.dots .p{background:var(--a)}.dots .b{background:var(--red)}.dots .w{background:var(--green)}
.cal .d.today .dots i{background:#fff}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);padding:6px 4px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}
.monthnav{display:flex;align-items:center;gap:4px}
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
.quick input{flex:1;border:0;background:none;padding:6px 0;min-width:0;font-size:16px}
.quick input:focus{outline:none}
.quick:focus-within{border-color:var(--a)}
.btn{border:0;background:var(--a);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn.ghost{background:var(--surf);color:var(--fg)}
.btn.danger{background:var(--red2);color:var(--red)}
.btn:disabled{opacity:.6;cursor:default}
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:14px}
.empty .ms{font-size:32px;color:var(--faint);display:block;margin:0 auto 6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scrim{position:fixed;inset:0;background:rgba(20,14,8,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0;font-size:18px;font-weight:500}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);background:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.chk .ms{font-size:16px}
.done .t{text-decoration:line-through;color:var(--muted)}
.hbar{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.hbar+.hbar{margin-top:8px}
.hbar .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--a);border-radius:5px}
.hbar .val{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}
.vbars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.vbars .stack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden}
.vbars .stack i{display:block;width:100%}
.vbars .lb{font-size:11px;color:var(--muted)}
.vbars .c.cur .lb{color:var(--a3);font-weight:500}
.kan{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surf);border-radius:14px;padding:10px;min-width:0}
.kcol h4{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--muted)}
.kcard{background:var(--card);border-radius:10px;padding:10px;font-size:14px}
.kcard+.kcard{margin-top:6px}
.tl{position:relative;overflow-x:auto}
.tlrow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;margin-top:8px}
.tltrack{position:relative;height:22px;background:var(--surf);border-radius:6px}
.tltrack i{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--a)}
.tltrack b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}
.photo{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--surf)}
.photo.big{width:100%;height:200px;border-radius:14px}
.sub-list{margin:6px 0 0 34px}
.sub-list .row{padding:8px 10px;background:var(--surf)}
.wchart{width:100%;height:auto;display:block}
.ai{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--a3)}
.note{background:var(--card);border-radius:12px;padding:12px;font-size:15px;line-height:1.7;white-space:pre-wrap}
hr.sp{border:0;height:1px;background:var(--line);margin:14px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="主导航"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
(() => {
/* ---------- constants ---------- */
const BILL_TYPES = [
  {k:'电费',ic:'bolt',unit:'度'},{k:'水费',ic:'water_drop',unit:'吨'},{k:'燃气',ic:'local_fire_department',unit:'方'},
  {k:'网费',ic:'wifi'},{k:'话费',ic:'smartphone'},{k:'房租',ic:'apartment'},{k:'订阅',ic:'subscriptions'},{k:'其他',ic:'receipt_long'}];
const DEFAULT_CATS = [{k:'吃饭',subs:['外卖','买菜做饭','咖啡','堂食','请客']},{k:'交通',subs:['地铁','打车','骑车']},{k:'衣服美妆',subs:['衣服','化妆品']},{k:'家居',subs:['家具','日用']},{k:'其他',subs:['其他','礼物']}];
const OLD2NEW = {'买菜做饭':['吃饭','买菜做饭'],'外食':['吃饭','堂食'],'请客':['吃饭','请客'],'咖啡':['吃饭','咖啡'],'衣服':['衣服美妆','衣服'],'化妆品':['衣服美妆','化妆品'],'家具':['家居','家具'],'日用':['家居','日用']};
const DEFAULT_RATES = {AUD:4.7,USD:7.1,EUR:7.8,HKD:0.91,GBP:9.2,JPY:0.048};
const SHOP_CATS = ['食品','日用','衣服','化妆品','家具家电','礼物','其他'];
const SHOP2EXP = {'食品':['吃饭','买菜做饭'],'日用':['家居','日用'],'衣服':['衣服美妆','衣服'],'化妆品':['衣服美妆','化妆品'],'家具家电':['家居','家具'],'礼物':['其他','礼物'],'其他':['其他','其他']};
const WK_TYPES = [{k:'器械',ic:'fitness_center'},{k:'徒步',ic:'directions_walk'},{k:'普拉提',ic:'self_improvement'},{k:'跳舞',ic:'music_note'},{k:'游泳',ic:'pool'}];
const PROJ_TYPES = ['课程作业','研究课题','考试复习','申请/职业','自学'];
const METHODS = ['支付宝','微信','银行卡','自动扣款','现金','其他'];
const CURS = {CNY:'¥',AUD:'A$',USD:'$',EUR:'€',HKD:'HK$',GBP:'£',JPY:'JP¥'};
const ACCENTS = [{k:'暖橙',v:'#E8772E'},{k:'陶土红',v:'#C2583A'},{k:'杏黄',v:'#E09A2B'},{k:'珊瑚',v:'#E2654F'}];
const FONTS = [
  {k:'黑体',v:"-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei'"},
  {k:'宋体',v:"'Songti SC','STSong','Noto Serif SC','SimSun',serif"},
  {k:'楷体',v:"'Kaiti SC','STKaiti','KaiTi',serif"}];
const URG = {3:{k:'急',c:'red'},2:{k:'一般',c:'gold'},1:{k:'不急',c:''}};
const COLS = ['bills','recurring','companies','expenses','shop','projects','tasks','reviews','workouts','weights','inbox'];

/* ---------- state ---------- */
const S = {settings:{}, loaded:new Set()};
COLS.forEach(c => S[c] = []);
const UI = {tab:'home', calMonth:ym(today()), selDay:today(), moneySeg:'overview', moneyMonth:ym(today()),
  billFilter:'', openCat:{}, entryCur:null, shopSeg:'todo', projView:'list', openProj:null, fitSeg:'workout', expanded:{}, aiMsg:''};
let db = null, sample = null, LOCAL = true;
function compressImage(file,max=720,q=0.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};img.src=url})}
const assets={upload:async f=>({id:await compressImage(f)}),delete:async()=>({deleted:true})};
function photoSrc(p){return String(p).startsWith('data:')?p:'/_blob/'+p}

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ym(s){return s.slice(0,7)}
function addMonths(m,n){let [y,mo]=m.split('-').map(Number);mo+=n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+pad(mo)}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5)}
function addDays(s,n){const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function weekStart(s){const d=new Date(s+'T00:00');const wd=(d.getDay()+6)%7;return addDays(s,-wd)}
function fmtD(s){if(!s)return '';const [y,m,d]=s.split('-');return `${+m}月${+d}日`}

function icon(n,extra=''){return `<span class="ms" aria-hidden="true" ${extra}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SVGI[n]||''}</svg></span>`}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function mainCur(){return S.settings.currency||'CNY'}
function sym(c){return CURS[c||mainCur()]||(c+' ')}
function dispCur(){return S.settings.viewCur||mainCur()}
function rateOf(c){if(c==='CNY')return 1;return Number((S.settings.rates||{})[c])||DEFAULT_RATES[c]||null}
function conv(a,c){a=Number(a)||0;c=c||mainCur();const t=dispCur();if(c===t)return a;const r=rateOf(c),b=rateOf(t);return r&&b?a*r/b:a}
function CATS(){return (S.settings.cats&&S.settings.cats.length)?S.settings.cats:DEFAULT_CATS}
function validPair(c,s){const x=CATS().find(y=>y.k===c);return !!x&&(x.subs.includes(s)||(!s&&!x.subs.length))}
function firstSub(c){const x=CATS().find(y=>y.k===c);return x&&x.subs.length?x.subs[0]:''}
function ecat(e){if(e.sub!==undefined&&CATS().some(c=>c.k===e.category))return [e.category,e.sub||''];const o=OLD2NEW[e.category];if(o)return o;const top=CATS().find(c=>c.k===e.category);return top?[top.k,e.sub||'']:['其他',e.category||'']}
function pairLabel(p){return p[1]?p[0]+' / '+p[1]:p[0]}
function money(a,c,dec){const v=Number(a)||0;const d=dec??(Math.abs(v)%1?2:0);return sym(c)+v.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function m0(a){return money(Math.round(a),dispCur(),0)}
function billType(k){return BILL_TYPES.find(b=>b.k===k)||BILL_TYPES[BILL_TYPES.length-1]}
function alertDays(){return Number(S.settings.alertDays??6)}
function pickBudget(list,m){const h=(list||[]).filter(b=>b.from<=m).sort((a,b)=>a.from<b.from?1:-1);return h.length?conv(h[0].amount,h[0].cur||'CNY'):null}
function budgetFor(m){return pickBudget(S.settings.budgets,m)}
function expBudgetFor(m){return pickBudget(S.settings.expBudgets,m)}
/* a bill counts in the month its period ends; older bills only have dueDate */
function bdate(b){return b.end||b.dueDate||b.start||''}
function periodLabel(b){if(b.start&&b.end)return fmtD(b.start)+'–'+fmtD(b.end);const d=bdate(b);return d?fmtD(d):''}
function monthBills(m){return S.bills.filter(b=>bdate(b)&&ym(bdate(b))===m)}
function yearBills(y){return S.bills.filter(b=>bdate(b).startsWith(y))}
function yearExp(y){return S.expenses.filter(e=>(e.date||'').startsWith(y))}
function monthExp(m){return S.expenses.filter(e=>e.date&&ym(e.date)===m)}
function sumConv(arr){return arr.reduce((s,x)=>s+conv(x.amount,x.currency),0)}
function moneyFor(m){const bills=sumConv(monthBills(m)),exp=sumConv(monthExp(m)),budget=budgetFor(m),expBudget=expBudgetFor(m);
  return {bills,exp,budget,left:budget==null?null:budget-bills-exp,expBudget,expLeft:expBudget==null?null:expBudget-exp}}
function projProgress(pid){const ts=S.tasks.filter(t=>t.projectId===pid);if(!ts.length)return null;const leaf=ts.filter(t=>!ts.some(c=>c.parentId===t.id));return leaf.filter(t=>t.status==='done').length/leaf.length}
function proj(id){return S.projects.find(p=>p.id===id)}
function company(id){return S.companies.find(c=>c.id===id)}
const CYCLES=[['1','每月'],['2','每两个月'],['3','每季度'],['6','每半年'],['12','每年'],['0','不固定']];
function cycleLabel(n){return (CYCLES.find(c=>c[0]===String(n))||[0,''])[1]}
function dayIn(mm,day){const [y,mo]=mm.split('-').map(Number);return mm+'-'+pad(Math.min(day,new Date(y,mo,0).getDate()))}
function coBills(co){return sorted(S.bills.filter(b=>b.companyId===co.id&&bdate(b)),bdate,true)}
/* first scheduled payment day on or after a date */
function schedOnOrAfter(co,ds){const day=Number(co.day);let m=ym(ds);let d=dayIn(m,day);if(d<ds){m=addMonths(m,1);d=dayIn(m,day)}return d}
function schedNext(co,d){return dayIn(addMonths(ym(d),Number(co.cycle)),Number(co.day))}
/* next payment for a company: {date, bill} — bill is the unpaid bill it belongs to, if one is recorded */
function nextDue(co){const td=today();const bs=coBills(co);
  const unpaid=sorted(bs.filter(b=>!b.paid),bdate)[0]||null;
  const n=Number(co.cycle),day=Number(co.day);
  if(!n||!day)return unpaid?{date:null,bill:unpaid}:null;
  if(unpaid)return {date:schedOnOrAfter(co,bdate(unpaid)),bill:unpaid};
  const lastPaid=bs.find(b=>b.paid);let d;
  if(lastPaid){d=schedNext(co,schedOnOrAfter(co,bdate(lastPaid)));let g=0;while(schedNext(co,d)<=td&&g++<60)d=schedNext(co,d)}
  else d=schedOnOrAfter(co,td);
  return {date:d,bill:null};}
/* reminders: every company with a scheduled date (with or without a recorded bill) */
function scheduleDues(){return S.companies.map(co=>{const nd=nextDue(co);return nd&&nd.date?{co,date:nd.date,bill:nd.bill}:null}).filter(Boolean)}
function sorted(a,f,desc){return [...a].sort((x,y)=>{const A=f(x)??'',B=f(y)??'';return (A<B?-1:A>B?1:0)*(desc?-1:1)})}

/* ---------- storage ---------- */
const IDB={db:null,open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('jilu',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise((res,rej)=>{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};
function snapshotState(){const o={settings:S.settings};COLS.forEach(c=>o[c]=S[c]);return o}
let persistT=null,storeWarned=false;
function persistLocal(){clearTimeout(persistT);persistT=setTimeout(async()=>{const o=snapshotState();
  try{if(IDB.db)await IDB.set('state',o);else localStorage.setItem('jilu',JSON.stringify(o))}
  catch(e){if(!storeWarned){storeWarned=true;toast('手机存储空间不够，数据可能没保存上。先导出一份备份')}}},150)}
window.addEventListener('pagehide',()=>{if(persistT){clearTimeout(persistT);const o=snapshotState();try{IDB.db?IDB.set('state',o):localStorage.setItem('jilu',JSON.stringify(o))}catch(e){}}});
async function put(col,id,data){
  data={...data};delete data.id;Object.keys(data).forEach(k=>data[k]===undefined&&delete data[k]);
  if(LOCAL){const i=S[col].findIndex(x=>x.id===id);const row={...data,id};if(i>=0)S[col][i]=row;else S[col].push(row);persistLocal();render();return}
  await db.collection(col).doc(id).set(data);
}
async function patch(col,id,p){
  if(LOCAL){const r=S[col].find(x=>x.id===id);if(r)Object.assign(r,p);persistLocal();render();return}
  await db.collection(col).doc(id).update(p);
}
async function remove(col,id){
  if(LOCAL){S[col]=S[col].filter(x=>x.id!==id);persistLocal();render();return}
  await db.collection(col).doc(id).delete();
}
async function saveSettings(p){
  S.settings={...S.settings,...p};applyLook();
  if(LOCAL){persistLocal();render();return}
  await db.doc('settings/main').set(S.settings);
}
async function safe(fn,okMsg){try{await fn();if(okMsg)toast(okMsg)}catch(e){toast(e&&e.code==='quota_exceeded'?'存储已满，删掉一些旧记录再试':'没保存上，检查网络后再试一次')}}

/* ---------- look ---------- */
function applyLook(){
  const r=document.documentElement;
  r.style.setProperty('--a',S.settings.accent||'#E8772E');
  const f=FONTS.find(x=>x.v===S.settings.font)||FONTS[0];
  r.style.setProperty('--f',`${f.v},system-ui,sans-serif`);
  r.style.setProperty('--num',`${f.v},system-ui,sans-serif`);
  const meta=document.querySelectorAll('meta[name="theme-color"]');
}

function snapInputs(root){const m={};root.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{if(el.type!=='file')m[el.id]=el.type==='checkbox'?el.checked:el.value});const a=document.activeElement;return {m,focus:a&&root.contains(a)?a.id:null}}
function restoreInputs(root,k){for(const id in k.m){const el=root.querySelector('#'+CSS.escape(id));if(el){if(el.type==='checkbox')el.checked=k.m[id];else el.value=k.m[id]}}if(k.focus){const el=root.querySelector('#'+CSS.escape(k.focus));if(el)el.focus()}}

      const r=await sample.json(`你在帮一个住在墨尔本、也常回中国的人记账，给这一条支出选一级和二级分类。只能从下面的分类里选，二级必须属于对应的一级：

      if(r&&validPair(r.category,r.sub)){pair=[r.category,r.sub];how='ai'}}

/* ---------- recurring bills ---------- */
let recurringDone=false;
async function ensureRecurring(){
  if(recurringDone||!S.loaded.has('recurring')||!S.loaded.has('bills'))return;
  recurringDone=true;
  const m=ym(today());
  for(const r of S.recurring){
    if(r.paused||(r.from&&r.from>m))continue;
    const id=`r-${r.id}-${m}`;
    if(S.bills.some(b=>b.id===id))continue;
    await safe(()=>put('bills',id,{type:r.type,companyId:r.companyId||'',amount:Number(r.amount)||0,currency:r.currency||mainCur(),start:`${m}-01`,end:dayIn(m,31),method:r.method||'',paid:false,recurringId:r.id,usage:null,note:''}));
  }
}

/* ---------- calendar ---------- */
function calEvents(){
  const ev={};const add=(d,k,item)=>{if(!d)return;(ev[d]=ev[d]||{p:[],b:[],w:[]})[k].push(item)};
  S.tasks.forEach(t=>{if(t.deadline)add(t.deadline,'p',{kind:'task',t})});
  S.projects.forEach(p=>{if(p.deadline)add(p.deadline,'p',{kind:'proj',p})});
  S.workouts.forEach(w=>{if(w.date)add(w.date,'w',w)});
  scheduleDues().forEach(x=>add(x.date,'b',{sched:x}));
  return ev;
}
function calendarHTML(m,sel,ev,actPrefix='cal'){
  const [y,mo]=m.split('-').map(Number);const first=new Date(y,mo-1,1);const lead=(first.getDay()+6)%7;const n=new Date(y,mo,0).getDate();const td=today();
  let h='<div class="cal">'+'一二三四五六日'.split('').map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++)h+='<div class="d other"></div>';
  for(let d=1;d<=n;d++){const ds=`${m}-${pad(d)}`;const e=ev[ds];
    const dots=e?[e.p.length?'<i class="p"></i>':'',e.b.length?'<i class="b"></i>':'',e.w.length?'<i class="w"></i>':''].join(''):'';
    h+=`<button class="d ${ds===td?'today':''} ${ds===sel?'sel':''}" data-act="${actPrefix}Day" data-d="${ds}" aria-label="${fmtD(ds)}">${d}<div class="dots">${dots}</div></button>`}
  return h+'</div>';
}

function ruleSummary(m){
  const mf=moneyFor(m);const tot=mf.bills+mf.exp;if(!tot)return '这个月还没有记录。';
  const [y,mo]=m.split('-');let out=`${+mo}月一共花了 ${m0(tot)}（账单 ${m0(mf.bills)}，支出 ${m0(mf.exp)}）`;

  if(mf.expBudget!=null)out+=mf.expLeft>=0?`可支配支出预算还剩 ${m0(mf.expLeft)}。`:`可支配支出预算超了 ${m0(-mf.expLeft)}。`;
  const ct=catTotals(m),pt=catTotals(addMonths(m,-1));const hasPrev=Object.keys(pt).length>0;
  if(hasPrev){const ks=[...new Set([...Object.keys(ct),...Object.keys(pt)])];let best=null;
    ks.forEach(k=>{const d=(ct[k]||0)-(pt[k]||0);if(!best||Math.abs(d)>Math.abs(best.d))best={k,d}});
    if(best&&Math.abs(best.d)>=1)out+=`\n和上个月比，变化最大的是「${best.k}」，${best.d>0?'多':'少'}了 ${m0(Math.abs(best.d))}。`}
  const ents=Object.entries(ct).sort((a,b)=>b[1]-a[1]);

    const st=subTotals(m)[ents[0][0]]||{};const top=Object.entries(st).sort((a,b)=>b[1]-a[1])[0];
    out+=top&&top[0]!=='未细分'?`，其中「${top[0]}」${m0(top[1])}。`:'。'}
  const days=m===ym(today())?+today().slice(8):new Date(+y,+mo,0).getDate();
  if(mf.exp>0)out+=`\n平均每天支出 ${m0(mf.exp/days)}。`;
  const room=mf.expLeft!=null?mf.expLeft:mf.left;
  if(m===ym(today())&&room!=null&&room>0){const left=new Date(+y,+mo,0).getDate()-days+1;out+=`本月还剩 ${left} 天，每天可以花 ${m0(room/left)}。`}
  return out}

    if(Object.keys(bt).length)h+=`<section class="sec"><div class="sech"><h2>本月按类型<small>THIS MONTH</small></h2></div><div class="panel">${Object.entries(bt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span>${k}</span><div class="track"><i style="width:${v/mx*100}%;background:var(--green)"></i></div><span class="val">${v} 分钟</span></div>`).join('')}</div></section>`;

    h+=`<section class="sec">${sorted(ws,w=>w.date,true).slice(0,20).map(w=>`<div class="row"><div class="grow"><div class="t">${w.value} 斤</div><div class="s">${fmtD(w.date)}</div></div><button class="iconbtn" data-act="delWt" data-id="${w.id}" aria-label="删除">${icon('delete')}</button></div>`).join('')}</section>`;

function weightChart(ws,goal){
  const W=340,H=180,L=36,R=10,T=12,B=26;const pts=ws.slice(-30);
  const vs=pts.map(p=>+p.value).concat(goal?[+goal]:[]);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<2){hi+=1;lo-=1}const padv=(hi-lo)*.12;lo-=padv;hi+=padv;
  const t0=new Date(pts[0].date).getTime(),t1=new Date(pts[pts.length-1].date).getTime()||t0+1;
  const x=d=>L+(W-L-R)*((new Date(d).getTime()-t0)/Math.max(1,t1-t0));const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[...Array(4)].map((_,i)=>lo+(hi-lo)*i/3);
  const path=pts.map((p,i)=>(i?'L':'M')+x(p.date).toFixed(1)+' '+y(+p.value).toFixed(1)).join(' ');
  const area=path+` L${x(pts[pts.length-1].date).toFixed(1)} ${H-B} L${x(pts[0].date).toFixed(1)} ${H-B} Z`;
  const lp=pts[pts.length-1];
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="体重折线图">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${t.toFixed(0)}</text>`).join('')}
  ${goal?`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end" font-size="10" fill="var(--green)">目标 ${goal}</text>`:''}
  <path d="${area}" fill="var(--a)" fill-opacity=".12"/><path d="${path}" fill="none" stroke="var(--a)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(p=>`<circle cx="${x(p.date)}" cy="${y(+p.value)}" r="2.5" fill="var(--a)"/>`).join('')}
  <circle cx="${x(lp.date)}" cy="${y(+lp.value)}" r="5" fill="var(--card)" stroke="var(--a)" stroke-width="2.5"/>
  <text x="${L}" y="${H-8}" font-size="10" fill="var(--muted)">${fmtD(pts[0].date)}</text><text x="${W-R}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtD(lp.date)}</text></svg>`;
}

function parseImport(text){
  const rows=[],bad=[];
  text.split(/\n+/).map(l=>l.trim().replace(/^[-*•\d.、)\s]+(?=\d{4}-)/,'')).filter(Boolean).forEach(line=>{
    const p=line.split(/\s*[|｜]\s*/).map(x=>x.trim());
    if(p.length<4){bad.push(line);return}
    const date=(p[0].match(/\d{4}-\d{1,2}-\d{1,2}/)||[])[0];
    const [c,sb]=(p[1]||'').split(/\s*[\/／]\s*/);
    const amount=parseFloat(String(p[3]).replace(/[^\d.]/g,''));
    let cur=(p[4]||'').toUpperCase().includes('AUD')||/澳/.test(p[4]||'')?'AUD':'CNY';
    if(!date||!(amount>0)){bad.push(line);return}
    const [y,mo,d]=date.split('-');
    let pair=validPair(c,sb||'')?[c,sb||'']:null;
    if(!pair&&sb){const top=CATS().find(x=>x.subs.includes(sb));if(top)pair=[top.k,sb]}
    rows.push({date:`${y}-${pad(+mo)}-${pad(+d)}`,pair,note:p[2]||'',amount,currency:cur,raw:line});
  });
  return {rows,bad};
}

function runSearch(q){
  const out=document.getElementById('searchOut');if(!out)return;q=q.trim().toLowerCase();if(!q){out.innerHTML='';return}
  const has=(...f)=>f.some(x=>String(x||'').toLowerCase().includes(q));let h='';
  const sec=(t,rows)=>{if(rows.length)h+=`<div class="small muted" style="margin:10px 4px 6px">${t}</div>`+rows.slice(0,8).join('')};
  sec('账单',S.bills.filter(b=>has(b.type,company(b.companyId)?.name,b.note,b.method)).map(b=>billRow(b)));
  sec('支出',S.expenses.filter(e=>has(e.note,...ecat(e))).map(expRow));
  sec('购物',S.shop.filter(s=>has(s.name,s.category)).map(shopRow));
  sec('任务',S.tasks.filter(t=>has(t.title,(t.tags||[]).join(' '))).map(t=>taskRow(t,{showProj:true})));
  sec('项目',S.projects.filter(p=>has(p.name,p.type)).map(p=>`<div class="row" data-act="openProj" data-id="${p.id}" role="button" tabindex="0"><div class="grow t">${esc(p.name)}</div></div>`));
  sec('公司',S.companies.filter(c=>has(c.name,c.howToPay,c.phone)).map(c=>`<div class="row" data-act="editCo" data-id="${c.id}" role="button" tabindex="0"><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.phone||'')}</div></div></div>`));
  sec('随手记',S.inbox.filter(x=>has(x.text)).map(x=>`<div class="row"><div class="grow t">${esc(x.text)}</div></div>`));
  out.innerHTML=h||empty('search','没有找到');
}

  aiSummary:async()=>{const out=document.getElementById('sumOut');const m=UI.moneyMonth;
    if(!sample){out.textContent='AI 现在用不了。上面的图表已经包含了本月的分类和趋势。';return}

    const data={月份:m,货币:dispCur(),总预算:mf.budget,总预算剩余:mf.left==null?null:Math.round(mf.left),可支配支出预算:mf.expBudget,可支配剩余:mf.expLeft==null?null:Math.round(mf.expLeft),账单合计:Math.round(mf.bills),支出合计:Math.round(mf.exp),账单按类型:bt,本月日常分类:ct,本月二级分类:subTotals(m),上月日常分类:pt,上月合计:Math.round(sumConv(monthBills(addMonths(m,-1)))+sumConv(monthExp(addMonths(m,-1))))};
    out.textContent='正在写…';
    try{const {text}=await sample(`你是一个说话直接的记账助手。根据下面这个月的数据，用中文写 3 句话的月度总结：第一句说总花销和预算情况，第二句指出变化最大的分类（和上月比，给出金额），第三句给一条具体、可执行的建议。不要用标题、列表或表情符号。\n\n${JSON.stringify(data)}`,{onText:({text})=>{out.textContent=text}});
      const sums={...(S.settings.summaries||{})};sums[m]=text;await safe(()=>saveSettings({summaries:sums}))}
    catch(e){if(aiOff(e)){sample=null;out.textContent='AI 现在用不了。'}else out.textContent=e.text||(e.code==='rate_limited'?'AI 用得太频繁了，稍后再试。':'没生成出来，再点一次试试。')}},

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]'))return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.dataset.act==='closeSheetBg'){fn(el.dataset,e,el);return}
  e.preventDefault();fn(el.dataset,e,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetFn){closeSheet();return}
  if(e.key==='Enter'&&!e.isComposing){
    const map={expQuick:'addExp',shopQuick:'addShop',taskQuick:null,inboxQuick:'addInbox',wtVal:'addWt',wkMin:'addWk'};
    const id=e.target.id;
    if(id==='taskQuick'){const b=e.target.parentNode.querySelector('[data-act="addTask"]');A.addTask(b.dataset);return}
    if(id&&id.startsWith('sub-')){A.addSub({id:id.slice(4)});return}
    if(id&&id.startsWith('newSub-')){A.addCatSub({i:id.slice(7)});return}
    if(id==='newTop'){A.addTop();return}
    if(map[id]){e.preventDefault();A[map[id]]({})}
    if(e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='searchQ')runSearch(e.target.value);
  if(e.target.id==='impText'){clearTimeout(window.__imp);window.__imp=setTimeout(drawSheet,250)}});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='bCo'){const n=document.getElementById('bCoNew');if(n)n.hidden=e.target.value!=='__new'}
  if(id==='bType'){const c=S.companies.find(c=>c.type===e.target.value);const s=document.getElementById('bCo');if(c&&s&&!s.value)s.value=c.id}
  if(id==='shopFile'){const f=e.target.files&&e.target.files[0];if(f){if(f.size>20e6){toast('照片太大了，换一张小于 20MB 的');return}UI.pendingPhoto=f;render()}}
  if(id==='importFile'){const f=e.target.files&&e.target.files[0];if(!f)return;f.text().then(t=>{let o;try{o=JSON.parse(t)}catch(_){toast('这个文件不是记录记录的备份');return}
    if(!o||!COLS.some(c=>Array.isArray(o[c]))){toast('这个文件不是记录记录的备份');return}
    UI.pendingImport=o;const n=COLS.reduce((s,c)=>s+(o[c]||[]).length,0);
    openSheet(()=>sheetHead('导入备份')+`<div class="small" style="margin-bottom:12px">备份里有 ${n} 条记录${o.exported?`，导出于 ${fmtD(o.exported.slice(0,10))}`:''}。导入会<b>替换</b>手机上现在的全部数据。</div><button class="btn danger" data-act="confirmImport" style="width:100%;justify-content:center">替换并恢复</button>`)});e.target.value='';return}
  if(id==='itFile'){const f=e.target.files&&e.target.files[0];const btn=document.querySelector('[data-act="itPhoto"]');if(!f||!btn)return;const itId=btn.dataset.id;
    btn.disabled=true;btn.textContent='上传中…';assets.upload(f).then(r=>{const it=S.shop.find(x=>x.id===itId);const old=it?.photo;return patch('shop',itId,{photo:r.id}).then(()=>{if(old)assets.delete(old).catch(()=>{});toast('照片已更新');closeSheet()})}).catch(()=>{toast('照片没传上去，再试一次');btn.disabled=false})}
});

/* ---------- boot ---------- */
function applyState(o){if(o){S.settings=o.settings||{};COLS.forEach(c=>S[c]=Array.isArray(o[c])?o[c]:[])}}
async function loadLocal(){let o=null;
  try{await IDB.open();o=await IDB.get('state')}catch(e){IDB.db=null}
  if(!o){try{o=JSON.parse(localStorage.getItem('jilu')||'null')}catch(e){}}
  applyState(o);COLS.forEach(c=>S.loaded.add(c));
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
async function boot(){
  render();
  await loadLocal();applyLook();if(S.settings.theme)document.documentElement.setAttribute('data-theme',S.settings.theme);
  render();ensureRecurring();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  return;
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};applyLook();
    if(S.settings.theme)document.documentElement.setAttribute('data-theme',S.settings.theme);else document.documentElement.removeAttribute('data-theme');render()},()=>{});
  COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded.add(col);render();ensureRecurring()},
    e=>{if(e&&e.code==='revoked')toast('数据连接已断开，刷新页面试试')}));
  render();
}
applyLook();
boot();
})();
